<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Forex Trade Log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #21262d;
  --border: #30363d;
  --fg: #e6edf3;
  --fg2: #8b949e;
  --fg3: #484f58;
  --green: #3fb950;
  --green-dim: #1a3a20;
  --red: #f85149;
  --red-dim: #3a1a1a;
  --gold: #d29922;
  --gold-dim: #2a2010;
  --amber: #e3a000;
  --amber-dim: #2e2000;
  --blue: #58a6ff;
  --accent: #1f6feb;
  color-scheme: dark;
  font-family: 'Space Grotesk', system-ui, sans-serif;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6f8fa;
    --surface: #ffffff;
    --surface2: #f0f3f6;
    --border: #d0d7de;
    --fg: #1f2328;
    --fg2: #636c76;
    --fg3: #afb8c1;
    --green: #1a7f37;
    --green-dim: #dafbe1;
    --red: #cf222e;
    --red-dim: #ffebe9;
    --gold: #9a6700;
    --gold-dim: #fdf8e0;
    --amber: #b35c00;
    --amber-dim: #fff3cd;
    --blue: #0969da;
    --accent: #0969da;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f6f8fa;
  --surface: #ffffff;
  --surface2: #f0f3f6;
  --border: #d0d7de;
  --fg: #1f2328;
  --fg2: #636c76;
  --fg3: #afb8c1;
  --green: #1a7f37;
  --green-dim: #dafbe1;
  --red: #cf222e;
  --red-dim: #ffebe9;
  --gold: #9a6700;
  --gold-dim: #fdf8e0;
  --amber: #b35c00;
  --amber-dim: #fff3cd;
  --blue: #0969da;
  --accent: #0969da;
  color-scheme: light;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--fg); font-size: 14px; line-height: 1.5; }

/* Sticky header */
.site-header {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg); border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex; align-items: center; justify-content: space-between;
}
.site-header h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
.site-header h1 span { color: var(--fg2); font-weight: 400; }
.header-actions { display: flex; gap: 8px; align-items: center; }
.theme-btn {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--fg2); border-radius: 6px; padding: 5px 10px;
  cursor: pointer; font-size: 12px; font-family: inherit;
}
.theme-btn:hover { color: var(--fg); border-color: var(--fg3); }

/* Stats bar */
.stats-bar {
  display: flex; flex-wrap: wrap; gap: 1px;
  background: var(--border); border-bottom: 1px solid var(--border);
}
.stat {
  flex: 1; min-width: 100px; padding: 14px 20px;
  background: var(--surface); display: flex; flex-direction: column; gap: 3px;
}
.stat-label { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg2); }
.stat-value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; font-family: 'JetBrains Mono', monospace; }
.stat-value.pos { color: var(--green); }
.stat-value.neg { color: var(--red); }
.stat-sub { font-size: 11px; color: var(--fg2); }

/* Main layout */
.main { padding: 24px; max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

/* Equity bar chart */
.equity-section h2 { font-size: 13px; font-weight: 600; color: var(--fg2); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 12px; }
.equity-bars { display: flex; align-items: flex-end; gap: 3px; height: 80px; }
.eq-bar {
  flex: 1; min-width: 8px; border-radius: 3px 3px 0 0;
  position: relative; cursor: default;
}
.eq-bar.pos { background: var(--green-dim); border-top: 2px solid var(--green); }
.eq-bar.neg { background: var(--red-dim); border-top: 2px solid var(--red); border-radius: 0 0 3px 3px; border-top: none; border-bottom: 2px solid var(--red); align-self: flex-start; }
.eq-bar:hover::after {
  content: attr(data-tip);
  position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%);
  background: var(--surface2); border: 1px solid var(--border); border-radius: 4px;
  padding: 3px 7px; font-size: 11px; white-space: nowrap; z-index: 10; color: var(--fg);
}

/* Strategy cards */
.strategy-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.strat-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px;
}
.strat-name { font-size: 11px; font-weight: 600; color: var(--fg2); letter-spacing: 0.03em; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strat-row { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
.strat-pnl { font-size: 18px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
.strat-pnl.pos { color: var(--green); }
.strat-pnl.neg { color: var(--red); }
.strat-meta { font-size: 11px; color: var(--fg2); }
.win-bar { height: 3px; border-radius: 2px; background: var(--border); margin-top: 10px; overflow: hidden; }
.win-fill { height: 100%; background: var(--green); border-radius: 2px; }

/* Filters */
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.filter-btn {
  padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border);
  background: transparent; color: var(--fg2); cursor: pointer; font-size: 12px; font-family: inherit;
  transition: all 0.15s;
}
.filter-btn:hover { border-color: var(--fg3); color: var(--fg); }
.filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.filter-sep { width: 1px; height: 20px; background: var(--border); }

/* Trade table */
.table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 10px 14px; text-align: left;
  font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg2);
  white-space: nowrap;
}
tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--surface2); }
tbody tr.hidden-row { display: none; }
td { padding: 10px 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.mono { font-family: 'JetBrains Mono', monospace; }
td.pos { color: var(--green); font-family: 'JetBrains Mono', monospace; font-weight: 600; }
td.neg { color: var(--red); font-family: 'JetBrains Mono', monospace; font-weight: 600; }

/* Badges */
.badge {
  display: inline-block; padding: 2px 8px; border-radius: 10px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
}
.badge-buy { background: rgba(63,185,80,0.15); color: var(--green); }
.badge-sell { background: rgba(248,81,73,0.15); color: var(--red); }
.badge-tp_max { background: var(--green-dim); color: var(--green); }
.badge-tp1 { background: rgba(63,185,80,0.1); color: var(--green); border: 1px solid rgba(63,185,80,0.3); }
.badge-tp2_trail { background: var(--amber-dim); color: var(--amber); }
.badge-sl_hit { background: var(--red-dim); color: var(--red); }
.badge-paper { background: var(--surface2); color: var(--fg2); border: 1px solid var(--border); }
.badge-real { background: var(--gold-dim); color: var(--gold); border: 1px solid rgba(210,153,34,0.3); }

.no-results { padding: 40px; text-align: center; color: var(--fg2); }

@media (max-width: 600px) {
  .site-header { padding: 10px 16px; }
  .main { padding: 16px; gap: 16px; }
  .stat { padding: 10px 14px; }
  .stat-value { font-size: 18px; }
  thead th, td { padding: 8px 10px; }
}
</style>

<header class="site-header">
  <h1>Forex Trade Log <span>/ Paper Trading</span></h1>
  <div class="header-actions">
    <button class="theme-btn" onclick="toggleTheme()">🌓 Theme</button>
  </div>
</header>

<div class="stats-bar" id="statsBar">
  <!-- filled by JS -->
</div>

<div class="main">
  <div class="equity-section">
    <h2>Cumulative P&amp;L per Trade</h2>
    <div class="equity-bars" id="equityBars"></div>
  </div>

  <div>
    <h2 style="font-size:13px;font-weight:600;color:var(--fg2);letter-spacing:.05em;text-transform:uppercase;margin-bottom:12px;">Strategy Breakdown</h2>
    <div class="strategy-grid" id="stratGrid"></div>
  </div>

  <div>
    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="win">Wins</button>
      <button class="filter-btn" data-filter="loss">Losses</button>
      <div class="filter-sep"></div>
      <button class="filter-btn" data-filter="BUY">BUY</button>
      <button class="filter-btn" data-filter="SELL">SELL</button>
      <div class="filter-sep"></div>
      <button class="filter-btn" data-filter="GOLD">Gold</button>
      <button class="filter-btn" data-filter="OIL">Oil</button>
      <div class="filter-sep"></div>
      <button class="filter-btn" data-filter="paper">Paper</button>
      <button class="filter-btn" data-filter="real">Real</button>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Date</th>
          <th>Strategy</th>
          <th>Symbol</th>
          <th>Dir</th>
          <th>TF</th>
          <th>Mode</th>
          <th>Outcome</th>
          <th>P&amp;L</th>
        </tr>
      </thead>
      <tbody id="tradeBody"></tbody>
    </table>
    <div class="no-results" id="noResults" hidden>No trades match this filter.</div>
  </div>
</div>

<script>
const TRADES = [
  {id:1,  date:'2026-09-15', strategy:'LIQ_RETEST_OIL_H1_LONDON',  symbol:'OILCash', dir:'SELL', tf:'H1',  mode:'paper', outcome:'tp_max',    pnl:8.00},
  {id:2,  date:'2026-09-17', strategy:'LIQ_DIRECT_OIL_M15_NY',     symbol:'OILCash', dir:'SELL', tf:'M15', mode:'paper', outcome:'sl_hit',    pnl:-2.00},
  {id:3,  date:'2026-09-25', strategy:'LIQ_DIRECT_OIL_M15_NY',     symbol:'OILCash', dir:'SELL', tf:'M15', mode:'paper', outcome:'sl_hit',    pnl:-2.00},
  {id:4,  date:'2026-10-01', strategy:'LIQ_DIRECT_OIL_M15_NY',     symbol:'OILCash', dir:'BUY',  tf:'M15', mode:'paper', outcome:'tp_max',    pnl:8.00},
  {id:5,  date:'2026-10-05', strategy:'LIQ_DIRECT_OIL_M15_NY',     symbol:'OILCash', dir:'BUY',  tf:'M15', mode:'paper', outcome:'tp1',       pnl:3.00},
  {id:6,  date:'2026-10-06', strategy:'LIQ_DIRECT_OIL_M15_NY',     symbol:'OILCash', dir:'SELL', tf:'M15', mode:'paper', outcome:'sl_hit',    pnl:-2.00},
  {id:7,  date:'2026-10-07', strategy:'ADX_GOLD_H4',               symbol:'GOLD',    dir:'SELL', tf:'H4',  mode:'paper', outcome:'tp_max',    pnl:8.00},
  {id:8,  date:'2026-10-08', strategy:'LIQ_DIRECT_OIL_M15_NY',     symbol:'OILCash', dir:'BUY',  tf:'M15', mode:'paper', outcome:'tp_max',    pnl:8.00},
  {id:9,  date:'2026-10-09', strategy:'LIQ_DIRECT_OIL_M15_NY',     symbol:'OILCash', dir:'SELL', tf:'M15', mode:'paper', outcome:'sl_hit',    pnl:-2.00},
  {id:10, date:'2026-10-12', strategy:'LIQ_RETEST_OIL_H1_LONDON',  symbol:'OILCash', dir:'SELL', tf:'H1',  mode:'paper', outcome:'sl_hit',    pnl:-2.11},
  {id:11, date:'2026-10-14', strategy:'LIQ_DIRECT_OIL_M15_NY',     symbol:'OILCash', dir:'BUY',  tf:'M15', mode:'paper', outcome:'sl_hit',    pnl:-2.44},
  {id:12, date:'2026-10-16', strategy:'LIQ_DIRECT_OIL_M15_NY',     symbol:'OILCash', dir:'BUY',  tf:'M15', mode:'paper', outcome:'sl_hit',    pnl:-2.36},
  {id:13, date:'2026-10-16', strategy:'LIQ_DIRECT_OIL_M15_NY',     symbol:'OILCash', dir:'BUY',  tf:'M15', mode:'paper', outcome:'tp_max',    pnl:8.09},
  {id:14, date:'2026-10-19', strategy:'LIQ_DIRECT_OIL_M15_NY',     symbol:'OILCash', dir:'BUY',  tf:'M15', mode:'paper', outcome:'tp_max',    pnl:8.43},
  {id:15, date:'2026-10-21', strategy:'LIQ_DIRECT_OIL_M15_NY',     symbol:'OILCash', dir:'BUY',  tf:'M15', mode:'paper', outcome:'sl_hit',    pnl:-2.38},
  {id:16, date:'2026-10-22', strategy:'LIQ_DIRECT_OIL_M15_NY',     symbol:'OILCash', dir:'SELL', tf:'M15', mode:'paper', outcome:'tp_max',    pnl:8.14},
  {id:17, date:'2026-10-23', strategy:'LIQ_DIRECT_OIL_M15_NY',     symbol:'OILCash', dir:'SELL', tf:'M15', mode:'paper', outcome:'sl_hit',    pnl:-2.26},
  {id:18, date:'2026-10-26', strategy:'LIQ_DIRECT_OIL_M15_NY',     symbol:'OILCash', dir:'SELL', tf:'M15', mode:'paper', outcome:'sl_hit',    pnl:-2.40},
  {id:19, date:'2026-10-26', strategy:'LIQ_DIRECT_OIL_M15_NY',     symbol:'OILCash', dir:'SELL', tf:'M15', mode:'paper', outcome:'sl_hit',    pnl:-2.35},
  {id:20, date:'2026-10-27', strategy:'LIQ_RETEST_GOLD_H1_LONDON', symbol:'GOLD',    dir:'BUY',  tf:'H1',  mode:'paper', outcome:'tp_max',    pnl:8.19},
  {id:21, date:'2026-10-28', strategy:'LIQ_DIRECT_OIL_M15_NY',     symbol:'OILCash', dir:'SELL', tf:'M15', mode:'paper', outcome:'sl_hit',    pnl:-2.10},
  {id:22, date:'2026-10-29', strategy:'LIQ_DIRECT_OIL_M15_NY',     symbol:'OILCash', dir:'BUY',  tf:'M15', mode:'paper', outcome:'sl_hit',    pnl:-2.53},
  {id:23, date:'2026-10-29', strategy:'ADX_GOLD_H4',               symbol:'GOLD',    dir:'SELL', tf:'H4',  mode:'paper', outcome:'tp2_trail', pnl:3.52},
  {id:24, date:'2026-10-30', strategy:'LIQ_DIRECT_OIL_M15_NY',     symbol:'OILCash', dir:'SELL', tf:'M15', mode:'paper', outcome:'tp2_trail', pnl:2.48},
];

function isWin(t) { return t.pnl > 0; }
function symbolGroup(t) { return t.symbol === 'GOLD' ? 'GOLD' : 'OIL'; }

let activeFilter = 'all';

function matchFilter(t, f) {
  if (f === 'all') return true;
  if (f === 'win') return isWin(t);
  if (f === 'loss') return !isWin(t);
  if (f === 'BUY') return t.dir === 'BUY';
  if (f === 'SELL') return t.dir === 'SELL';
  if (f === 'GOLD') return t.symbol === 'GOLD';
  if (f === 'OIL') return t.symbol === 'OILCash';
  if (f === 'paper') return t.mode === 'paper';
  if (f === 'real') return t.mode === 'real';
  return true;
}

function fmtPnl(v) { return (v >= 0 ? '+$' : '-$') + Math.abs(v).toFixed(2); }
function fmtDate(d) {
  const [y,m,day] = d.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[+m-1]} ${+day}`;
}

function outcomeLabel(o) {
  const labels = { tp_max:'TP MAX', tp1:'TP1', tp2_trail:'TP2 TRAIL', sl_hit:'SL HIT' };
  return labels[o] || o;
}

function renderStats() {
  const filtered = TRADES.filter(t => matchFilter(t, activeFilter));
  const wins = filtered.filter(isWin);
  const losses = filtered.filter(t => !isWin(t));
  const totalPnl = filtered.reduce((s,t) => s+t.pnl, 0);
  const wr = filtered.length ? Math.round(wins.length/filtered.length*100) : 0;
  const avgWin = wins.length ? wins.reduce((s,t)=>s+t.pnl,0)/wins.length : 0;
  const avgLoss = losses.length ? losses.reduce((s,t)=>s+t.pnl,0)/losses.length : 0;

  document.getElementById('statsBar').innerHTML = `
    <div class="stat"><div class="stat-label">Trades</div><div class="stat-value">${filtered.length}</div><div class="stat-sub">${wins.length}W / ${losses.length}L</div></div>
    <div class="stat"><div class="stat-label">Win Rate</div><div class="stat-value ${wr>=50?'pos':'neg'}">${wr}%</div><div class="stat-sub">of ${filtered.length} closed</div></div>
    <div class="stat"><div class="stat-label">Net P&L</div><div class="stat-value ${totalPnl>=0?'pos':'neg'}">${fmtPnl(totalPnl)}</div><div class="stat-sub">paper account</div></div>
    <div class="stat"><div class="stat-label">Avg Win</div><div class="stat-value pos">${avgWin>0?fmtPnl(avgWin):'—'}</div><div class="stat-sub">per winning trade</div></div>
    <div class="stat"><div class="stat-label">Avg Loss</div><div class="stat-value neg">${avgLoss<0?fmtPnl(avgLoss):'—'}</div><div class="stat-sub">per losing trade</div></div>
  `;
}

function renderEquity() {
  const filtered = TRADES.filter(t => matchFilter(t, activeFilter));
  let running = 0;
  const bars = filtered.map(t => { running += t.pnl; return {pnl: t.pnl, cum: running, t}; });
  const maxAbs = Math.max(...bars.map(b => Math.abs(b.pnl)), 1);

  document.getElementById('equityBars').innerHTML = bars.map(b => {
    const h = Math.round(Math.abs(b.pnl) / maxAbs * 72);
    const cls = b.pnl >= 0 ? 'pos' : 'neg';
    const tip = `#${b.t.id} ${fmtDate(b.t.date)}: ${fmtPnl(b.pnl)} (cum: ${fmtPnl(b.cum)})`;
    return `<div class="eq-bar ${cls}" style="height:${h}px" data-tip="${tip}"></div>`;
  }).join('');
}

function renderStratCards() {
  const filtered = TRADES.filter(t => matchFilter(t, activeFilter));
  const map = {};
  filtered.forEach(t => {
    if (!map[t.strategy]) map[t.strategy] = {trades:0,wins:0,pnl:0};
    map[t.strategy].trades++;
    if (isWin(t)) map[t.strategy].wins++;
    map[t.strategy].pnl += t.pnl;
  });

  const shortName = s => s.replace('LIQ_RETEST_','').replace('LIQ_DIRECT_','').replace('_LONDON','·LDN').replace('_NY','·NY').replace('OIL_H1','OIL H1').replace('OIL_M15','OIL M15').replace('GOLD_H1','GOLD H1');

  document.getElementById('stratGrid').innerHTML = Object.entries(map).map(([s,d]) => {
    const wr = d.trades ? Math.round(d.wins/d.trades*100) : 0;
    const cls = d.pnl >= 0 ? 'pos' : 'neg';
    return `<div class="strat-card">
      <div class="strat-name" title="${s}">${shortName(s)}</div>
      <div class="strat-row">
        <div class="strat-pnl ${cls}">${fmtPnl(d.pnl)}</div>
        <div class="strat-meta">${d.wins}/${d.trades} wins</div>
      </div>
      <div class="win-bar"><div class="win-fill" style="width:${wr}%"></div></div>
    </div>`;
  }).join('');
}

function renderTable() {
  const filtered = TRADES.filter(t => matchFilter(t, activeFilter));
  const body = document.getElementById('tradeBody');
  body.innerHTML = filtered.map((t,i) => `
    <tr>
      <td class="mono" style="color:var(--fg3)">${i+1}</td>
      <td>${fmtDate(t.date)}</td>
      <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;color:var(--fg2);font-size:12px">${t.strategy}</td>
      <td>${t.symbol}</td>
      <td><span class="badge badge-${t.dir.toLowerCase()}">${t.dir}</span></td>
      <td style="color:var(--fg2)">${t.tf}</td>
      <td><span class="badge badge-${t.mode}">${t.mode}</span></td>
      <td><span class="badge badge-${t.outcome}">${outcomeLabel(t.outcome)}</span></td>
      <td class="${t.pnl>=0?'pos':'neg'}">${fmtPnl(t.pnl)}</td>
    </tr>
  `).join('');
  document.getElementById('noResults').hidden = filtered.length > 0;
}

function render() {
  renderStats();
  renderEquity();
  renderStratCards();
  renderTable();
}

document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = btn.dataset.filter;
  render();
});

function toggleTheme() {
  const root = document.documentElement;
  const cur = root.getAttribute('data-theme');
  root.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
}

render();
</script>

</body></html>
